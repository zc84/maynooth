services:
  - type: web
    name: maynooth-brokensong
    runtime: static
    buildCommand: 'echo "Static site: no build step"'
    staticPublishPath: .
    branch: main
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
